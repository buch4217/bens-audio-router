:root{--bg:#12141A;--bg2:#171A21;--surf:#1D212A;--surf2:#262B36;--hi:#303644;--bd:#2C323E;--tx:#EEF1F7;--dim:#8D96A8;--ac:#5B8CFF;--ok:#3FCB86;--bad:#F0545A;--warn:#F0B14A;--can:#0C0E12;--body:#1D212A;--r:18px;color-scheme:dark}
