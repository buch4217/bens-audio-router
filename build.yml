name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 flac ffmpeg python3-pip

      - name: Windows-EXE bauen (MinGW-w64)
        run: ./src/build.sh

      - name: Kern-Tests (nativ)
        run: |
          cd tests
          g++ -O3 -ffast-math -std=c++17 -I../src test_core.cpp  -o test_core  && ./test_core
          g++ -O2 -std=c++17 -I../src test_calib.cpp -o test_calib && ./test_calib
          g++ -O2 -std=c++17 -I../src test_flac.cpp  -o test_flac  && ./test_flac 24 48000 && flac -t -s /tmp/t.flac
          pip install cryptography numpy && python3 verify_crypto.py
          g++ -O2 -std=c++17 -pthread -I../src test_wavrec.cpp -o test_wavrec && mkdir -p /tmp/wt && ./test_wavrec /tmp/wt && python3 verify_wavrec.py /tmp/wt
          g++ -O2 -std=c++17 -I../src test_route.cpp -o test_route && ./test_route

      - name: Release-Paket schnüren
        run: |
          mkdir -p dist/docs
          cp src/BensAudioRouter.exe README.md LICENSE CHANGELOG.md THIRD_PARTY.md dist/
          cp -r docs/* dist/docs/
          pip install markdown && python3 tools/build_docs.py && cp docs/Anleitung.html dist/
          cd dist && zip -r ../BensAudioRouter-win64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: BensAudioRouter-win64
          path: BensAudioRouter-win64.zip

      - name: GitHub-Release bei Tag (v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BensAudioRouter-win64.zip
          generate_release_notes: true
